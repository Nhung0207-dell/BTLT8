<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu 14 - Dark/Light Theme</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body.light-theme { background-color: #ffffff; color: #333333; }
        body.dark-theme { background-color: #1a1a1a; color: #ffffff; }
        .switch-btn { padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="light-theme">
    <h2>Trang web chuyển đổi giao diện</h2>
    <p>Nhấn vào nút bên dưới để chuyển đổi giữa nền sáng và nền tối.</p>
    <button id="themeToggle" class="switch-btn">Chuyển sang Tối (Off)</button>

    <script>
        $(document).ready(function() {
            var isLight = true;
            $('#themeToggle').click(function() {
                if (isLight) {
                    $('body').removeClass('light-theme').addClass('dark-theme');
                    $(this).text('Chuyển sang Sáng (On)');
                    isLight = false;
                } else {
                    $('body').removeClass('dark-theme').addClass('light-theme');
                    $(this).text('Chuyển sang Tối (Off)');
                    isLight = true;
                }
            });
        });
    </script>
</body>
</html>
