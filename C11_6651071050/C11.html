<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu 11 - Thông tin file upload</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h3>Chọn file để xem tên và phần mở rộng</h3>
    <input type="file" id="fileInput">
    <div id="fileInfo" style="margin-top: 15px; font-weight: bold;"></div>

    <script>
        $(document).ready(function() {
            $('#fileInput').on('change', function() {
                var file = this.files[0];
                if (file) {
                    var fileName = file.name;
                    var extension = fileName.split('.').pop();
                    $('#fileInfo').html('Tên file: ' + fileName + '<br>Phần mở rộng: .' + extension);
                } else {
                    $('#fileInfo').html('');
                }
            });
        });
    </script>
</body>
</html>
